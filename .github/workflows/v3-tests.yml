name: Kavshara V3 tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install V3 test dependencies
        run: python -m pip install --upgrade pip && python -m pip install "pyautogui>=0.9.54,<1" "psutil>=7.0.0,<8"
      - name: Compile Python
        run: python -m compileall -q .
      - name: Run tests
        run: python -m unittest discover -s tests -v
