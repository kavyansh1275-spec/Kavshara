name: Kavshara V1 QA

on:
  push:
    branches: ["main", "v1-foundation"]
  pull_request:

jobs:
  v1-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile V1
        run: python -m compileall -q v1

      - name: Run V1 unit tests
        run: python -m unittest discover -s v1/tests -p "test_*.py" -v
